<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Termin stornieren – Kimmy Nails</title>
  <link rel="icon" href="/public/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/booking-pages.css">
  <script src="/cancel.js" defer></script>
</head>
<body>
  <main class="booking-page">
    <header class="booking-page-header"><a class="brand" href="/">KIMMYNAILS</a><a href="/">← Zur Website</a></header>
    <section class="standalone-card" aria-labelledby="cancel-title">
      <h1 id="cancel-title">Termin stornieren</h1>
      <p>Bitte prüfen Sie die Angaben, bevor Sie Ihren Termin stornieren.</p>
      <div data-cancel-loading>Termin wird geladen…</div>
      <div hidden data-cancel-content>
        <dl data-cancel-summary></dl>
        <button class="gold-button" type="button" data-cancel-button>Cancel Booking / Hủy lịch</button>
      </div>
      <p class="page-message" role="alert" hidden data-cancel-message></p>
    </section>
  </main>
</body>
</html>
